app:
  name: "WeatherMLOps Real-Time Data Pipeline"
  env: "production"
  timezone: "Asia/Seoul"

collection:
  interval_seconds: 60  # 1분 단위
  timeout_seconds: 10
  retry_attempts: 3
  retry_delay_seconds: 2

